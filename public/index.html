<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Among Us - Клон</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/artemkf161rus-max/AmongUsBrowser/main/public/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a2a; color: white; font-family: Arial, sans-serif; overflow: hidden; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0a0a2a; z-index: 10; }
        .hidden { display: none !important; }
        button, input { padding: 12px 24px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; }
        button { background: #3a6ea5; color: white; transition: 0.2s; }
        button:hover { background: #2c4f7a; transform: scale(1.02); }
        input { background: #1a1a3a; color: white; border: 1px solid #3a6ea5; text-align: center; }
        #lobbiesList { width: 80%; max-width: 600px; height: 300px; overflow-y: auto; background: #1a1a3a; border-radius: 10px; padding: 10px; }
        .lobby-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin: 5px 0; background: #2a2a4a; border-radius: 5px; }
        #gameUI { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; z-index: 20; min-width: 220px; text-align: center; backdrop-filter: blur(5px); border: 1px solid #3a6ea5; }
        #gameCanvas { display: block; width: 100%; height: 100vh; background: black; cursor: crosshair; }
        #roleDisplay { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        #killBtn { margin-top: 10px; background: #aa2222; width: 100%; }
        #killBtn:hover { background: #cc3333; }
        #startGameBtn { margin-top: 10px; background: #3a6ea5; width: 100%; }
        #startGameBtn:hover { background: #2c4f7a; }
        #reportBtn { margin-top: 10px; background: #ffaa00; color: black; width: 100%; }
        #reportBtn:hover { background: #ffcc44; }
        #chatBtn { margin-top: 10px; background: #3a6ea5; width: 100%; }
        #colorBtn { margin-top: 10px; background: #6a3ea5; width: 100%; }
        #colorBtn:hover { background: #5a2e95; }
        .color-indicator { font-size: 12px; margin-top: 5px; }
        
        .chat-window {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 400px;
            background: rgba(0,0,0,0.95);
            border-radius: 10px;
            border: 1px solid #3a6ea5;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .chat-header {
            padding: 10px;
            background: #1a1a3a;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { margin: 0; font-size: 14px; }
        .chat-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0 5px; }
        .chat-close:hover { color: #ff6666; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
        .chat-input-area { display: flex; padding: 10px; gap: 5px; border-top: 1px solid #3a6ea5; }
        .chat-input-area input { flex: 1; padding: 8px; font-size: 12px; }
        .chat-input-area button { padding: 8px 15px; font-size: 12px; }
        .chat-message { margin-bottom: 5px; word-wrap: break-word; }
        .chat-sender { color: #ffaa00; font-weight: bold; }
        .chat-text { color: white; }
        .system-message { color: #888; font-style: italic; }
        
        .meeting-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            background: rgba(0,0,0,0.98);
            border-radius: 15px;
            border: 2px solid #ffaa00;
            display: flex;
            flex-direction: column;
            z-index: 200;
        }
        .meeting-header { padding: 15px; background: #1a1a3a; border-radius: 15px 15px 0 0; text-align: center; }
        .meeting-header h2 { color: #ffaa00; margin: 0; }
        .meeting-timer { font-size: 24px; font-weight: bold; color: #ffaa00; text-align: center; padding: 10px; }
        .meeting-vote-buttons { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; justify-content: center; max-height: 300px; overflow-y: auto; }
        .vote-btn { padding: 10px 20px; background: #3a6ea5; font-size: 16px; min-width: 100px; }
        .vote-btn:hover { background: #2c4f7a; }
        .skip-btn { background: #888; }
        .skip-btn:hover { background: #666; }
        .meeting-status { text-align: center; padding: 10px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div id="menuScreen" class="screen">
    <h1>🚀 Among Us</h1>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="playerName" placeholder="Введите имя" maxlength="20" style="flex: 1;">
        <button id="randomNameBtn" style="width: auto; padding: 12px 20px;">🎲</button>
    </div>
    <button id="playBtn">🔫 Играть</button>
</div>

<div id="lobbiesScreen" class="screen hidden">
    <h2>🏆 Список лобби</h2>
    <div id="lobbiesList"></div>
    <button id="createLobbyBtn">➕ Создать лобби (The Skeld)</button>
    <button id="refreshLobbiesBtn">🔄 Обновить</button>
    <button id="backToMenuBtn">⬅ Назад</button>
</div>

<div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>
    <div id="gameUI">
        <div id="roleDisplay"></div>
        <div id="colorIndicator" class="color-indicator"></div>
        <button id="startGameBtn" class="hidden">🎮 Старт игры</button>
        <button id="killBtn" class="hidden">🔪 Убить</button>
        <button id="reportBtn" class="hidden">⚠️ Репорт (труп)</button>
        <button id="colorBtn">🎨 Сменить цвет</button>
        <button id="chatBtn">💬 Чат</button>
    </div>
</div>

<div id="chatWindow" class="chat-window" style="display: none;">
    <div class="chat-header">
        <h3>💬 Чат (лобби)</h3>
        <button class="chat-close" onclick="closeChat()">✖</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Введите сообщение..." maxlength="100">
        <button id="sendChatBtn">➤</button>
    </div>
</div>

<div id="meetingWindow" class="meeting-window" style="display: none;">
    <div class="meeting-header">
        <h2>📢 СОБРАНИЕ</h2>
    </div>
    <div id="meetingTimer" class="meeting-timer">⏱️ 30 сек</div>
    <div id="meetingStatus" class="meeting-status">Голосование...</div>
    <div id="meetingVoteButtons" class="meeting-vote-buttons"></div>
</div>

<script>
    let ws = null;
    let currentLobbyId = null;
    let myName = "";
    let myColor = "blue";
    let isImpostor = false;
    let gameStarted = false;
    let isHost = false;
    let isAlive = true;
    let players = new Map();
    let walls = [];
    let currentMapType = null;
    let mapToDraw = null;
    let mapWidth = 0, mapHeight = 0;
    let meetingActive = false;
    let meetingTimer = null;
    let hasVoted = false;
    let showHitboxes = false;
    
    let player = { x: 499, y: 353, w: 32, h: 32, speed: 2.5, dir: 'right' };
    
    // Спрайты для голубого (по умолчанию)
    const blueSpriteLeft = new Image();
    const blueSpriteRight = new Image();
    blueSpriteLeft.src = '/playerleft.png';
    blueSpriteRight.src = '/playerright.png';
    
    // Спрайты для красного
    const redSpriteLeft = new Image();
    const redSpriteRight = new Image();
    redSpriteLeft.src = '/redplayerleft.png';
    redSpriteRight.src = '/redplayerright.png';
    
    // Трупы
    const deadSpriteBlue = new Image();
    const deadSpriteRed = new Image();
    deadSpriteBlue.src = '/dead.png';
    deadSpriteRed.src = '/reddead.png';
    
    const stepSound = new Audio('/step.ogg');
    stepSound.volume = 0.3;
    let lastStepTime = 0;
    let lastStepX = 0, lastStepY = 0;
    
    // Отладка хитбоксов по клавише H
    window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
            showHitboxes = !showHitboxes;
            console.log(`🔍 Хитбоксы ${showHitboxes ? 'показаны' : 'скрыты'}`);
        }
    });
    
    const menuScreen = document.getElementById('menuScreen');
    const lobbiesScreen = document.getElementById('lobbiesScreen');
    const gameScreen = document.getElementById('gameScreen');
    const lobbiesList = document.getElementById('lobbiesList');
    const startGameBtn = document.getElementById('startGameBtn');
    const killBtn = document.getElementById('killBtn');
    const reportBtn = document.getElementById('reportBtn');
    const colorBtn = document.getElementById('colorBtn');
    const colorIndicator = document.getElementById('colorIndicator');
    const roleDisplay = document.getElementById('roleDisplay');
    const chatBtn = document.getElementById('chatBtn');
    const chatWindow = document.getElementById('chatWindow');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const meetingWindow = document.getElementById('meetingWindow');
    const meetingTimerDiv = document.getElementById('meetingTimer');
    const meetingVoteButtons = document.getElementById('meetingVoteButtons');
    const meetingStatus = document.getElementById('meetingStatus');
    
    let namesList = [];

    // Загружаем имена из nicks.txt
    fetch('/nicks.txt')
        .then(response => response.text())
        .then(text => {
            namesList = text.split(/\r?\n/).filter(name => name.trim().length > 0);
            console.log(`✅ Загружено ${namesList.length} имён`);
        })
        .catch(err => console.error('❌ Ошибка загрузки nicks.txt:', err));

    document.getElementById('randomNameBtn').onclick = () => {
        if (namesList.length === 0) {
            alert('Список имён ещё не загрузился, попробуй через секунду');
            return;
        }
        const randomIndex = Math.floor(Math.random() * namesList.length);
        document.getElementById('playerName').value = namesList[randomIndex];
    };
    
    document.getElementById('playBtn').onclick = () => {
        myName = document.getElementById('playerName').value.trim();
        if (!myName) { alert('Введите имя!'); return; }
        menuScreen.classList.add('hidden');
        lobbiesScreen.classList.remove('hidden');
        refreshLobbies();
    };
    
    document.getElementById('createLobbyBtn').onclick = () => connectAndCreate('skeld');
    document.getElementById('refreshLobbiesBtn').onclick = () => refreshLobbies();
    document.getElementById('backToMenuBtn').onclick = () => { if(ws) ws.close(); lobbiesScreen.classList.add('hidden'); menuScreen.classList.remove('hidden'); };
    startGameBtn.onclick = () => { if(isHost && !gameStarted) ws.send(JSON.stringify({type:'start_game'})); };
    killBtn.onclick = () => { if(gameStarted && isImpostor && !meetingActive && isAlive) ws.send(JSON.stringify({type:'kill'})); };
    reportBtn.onclick = () => { if(gameStarted && !meetingActive && isAlive) checkAndReport(); };
    
    colorBtn.onclick = () => {
        if (gameStarted) {
            alert('Нельзя сменить цвет во время игры!');
            return;
        }
        const newColor = myColor === 'blue' ? 'red' : 'blue';
        myColor = newColor;
        colorIndicator.textContent = `🎨 Цвет: ${myColor === 'blue' ? 'Голубой' : 'Красный'}`;
        if (ws) {
            ws.send(JSON.stringify({ type: 'change_color', color: myColor }));
        }
    };
    
    window.closeChat = function() { chatWindow.style.display = 'none'; };
    chatBtn.onclick = () => { 
        if (!gameStarted) {
            chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none'; 
        }
    };
    
    function getPlayerSprite(color, dir) {
        if (color === 'red') {
            return dir === 'left' ? redSpriteLeft : redSpriteRight;
        }
        return dir === 'left' ? blueSpriteLeft : blueSpriteRight;
    }
    
    function getDeadSprite(color) {
        return color === 'red' ? deadSpriteRed : deadSpriteBlue;
    }
    
    function addChatMessage(sender, message, isSystem = false) {
        const div = document.createElement('div');
        div.className = 'chat-message';
        if (isSystem) {
            div.innerHTML = `<span class="system-message">📢 ${message}</span>`;
        } else {
            div.innerHTML = `<span class="chat-sender">${sender}:</span><span class="chat-text"> ${message}</span>`;
        }
        chatMessagesDiv.appendChild(div);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }
    
    document.getElementById('sendChatBtn').onclick = () => {
        const msg = chatInput.value.trim();
        if (msg && ws && !gameStarted) {
            ws.send(JSON.stringify({ type: 'chat_message', message: msg, sender: myName }));
            chatInput.value = '';
        }
    };
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendChatBtn').click(); });
    
    function startMeeting(data) {
        meetingActive = true;
        hasVoted = false;
        meetingVoteButtons.innerHTML = '';
        meetingWindow.style.display = 'flex';
        meetingStatus.textContent = `Собрание начал ${data.reporter}`;
        
        let timeLeft = 30;
        meetingTimerDiv.textContent = `⏱️ ${timeLeft} сек`;
        if (meetingTimer) clearInterval(meetingTimer);
        meetingTimer = setInterval(() => {
            timeLeft--;
            meetingTimerDiv.textContent = `⏱️ ${timeLeft} сек`;
            if (timeLeft <= 0) {
                clearInterval(meetingTimer);
            }
        }, 1000);
        
        for (let name of data.players) {
            if (name !== myName) {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.className = 'vote-btn';
                btn.onclick = () => {
                    if (!hasVoted) {
                        ws.send(JSON.stringify({ type: 'vote', target: name }));
                        hasVoted = true;
                        meetingStatus.textContent = `Вы проголосовали за ${name}. Ожидание остальных...`;
                        btn.disabled = true;
                        btn.style.opacity = '0.5';
                    }
                };
                meetingVoteButtons.appendChild(btn);
            }
        }
        const skipBtn = document.createElement('button');
        skipBtn.textContent = '⏭️ Пропустить';
        skipBtn.className = 'vote-btn skip-btn';
        skipBtn.onclick = () => {
            if (!hasVoted) {
                ws.send(JSON.stringify({ type: 'skip_vote' }));
                hasVoted = true;
                meetingStatus.textContent = 'Вы пропустили голосование. Ожидание остальных...';
                skipBtn.disabled = true;
                skipBtn.style.opacity = '0.5';
            }
        };
        meetingVoteButtons.appendChild(skipBtn);
    }
    
    function endMeeting(result) {
        meetingActive = false;
        if (meetingTimer) clearInterval(meetingTimer);
        meetingWindow.style.display = 'none';
        alert(result);
    }
    
    function checkAndReport() {
        let bodyNear = false;
        for (let [name, p] of players.entries()) {
            if (!p.alive && p.bodyX && p.bodyY) {
                const dx = player.x - p.bodyX;
                const dy = player.y - p.bodyY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 60) {
                    bodyNear = true;
                    break;
                }
            }
        }
        if (bodyNear) {
            ws.send(JSON.stringify({ type: 'report' }));
        } else {
            alert('Рядом нет трупа!');
        }
    }
    
    window.joinLobby = function(lobbyId) {
        if (!lobbyId) { alert('Ошибка: ID лобби не передан'); return; }
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            connectWebSocket().then(() => {
                ws.send(JSON.stringify({ type: 'join_lobby', lobbyId: lobbyId, name: myName }));
            });
        } else {
            ws.send(JSON.stringify({ type: 'join_lobby', lobbyId: lobbyId, name: myName }));
        }
    };
    
    async function refreshLobbies() { 
        if(!ws || ws.readyState !== WebSocket.OPEN) await connectWebSocket(); 
        ws.send(JSON.stringify({type:'get_lobbies'})); 
    }
    
    async function connectAndCreate(mapType) { 
        if(!ws || ws.readyState !== WebSocket.OPEN) await connectWebSocket(); 
        ws.send(JSON.stringify({type:'create_lobby', name:myName, mapType:mapType})); 
    }
    
    function connectWebSocket() {
        return new Promise((resolve) => {
            ws = new WebSocket(`wss://${window.location.hostname}`);
            ws.onopen = () => { console.log('Connected'); resolve(); };
            ws.onmessage = (event) => { handleMessage(JSON.parse(event.data)); };
            ws.onclose = () => { console.log('Disconnected'); if(gameStarted) alert('Соединение потеряно'); };
        });
    }
    
    function playStepSound(x, y) {
        if (meetingActive) return;
        if (!isAlive) return;
        const now = Date.now();
        const dx = Math.abs(x - lastStepX);
        const dy = Math.abs(y - lastStepY);
        if (now - lastStepTime > 200 && (dx > 5 || dy > 5)) {
            stepSound.currentTime = 0;
            stepSound.play().catch(e => console.log('Audio error:', e));
            lastStepTime = now;
            lastStepX = x;
            lastStepY = y;
        }
    }
    
    function returnToLobby(data) {
        gameStarted = false;
        meetingActive = false;
        isImpostor = false;
        isAlive = true;
        currentMapType = 'skeld';
        
        players.clear();
        data.players.forEach(p => {
            players.set(p.name, { x: p.x, y: p.y, isImpostor: false, alive: true, dir: p.dir || 'right', bodyX: null, bodyY: null, color: p.color || 'blue' });
            if (p.name === myName && p.color) {
                myColor = p.color;
                colorIndicator.textContent = `🎨 Цвет: ${myColor === 'blue' ? 'Голубой' : 'Красный'}`;
            }
        });
        
        player.x = 499;
        player.y = 353;
        player.dir = 'right';
        player.speed = 2.5;
        
        isHost = data.isHost;
        
        if (isHost) startGameBtn.classList.remove('hidden');
        else startGameBtn.classList.add('hidden');
        
        killBtn.classList.add('hidden');
        reportBtn.classList.add('hidden');
        roleDisplay.textContent = '📡 ЛОББИ';
        roleDisplay.style.color = '#ffaa00';
        
        loadMap('skeld', true);
    }
    
    function handleMessage(data) {
        console.log('Получено:', data.type);
        
        if(data.type === 'lobbies_list') {
            lobbiesList.innerHTML = '';
            if(!data.lobbies || data.lobbies.length === 0) {
                lobbiesList.innerHTML = '<div class="lobby-item">😢 Нет лобби. Создай новое!</div>';
            } else {
                data.lobbies.forEach(lobby => {
                    const div = document.createElement('div'); 
                    div.className = 'lobby-item';
                    div.innerHTML = `<span>🏠 Лобби ${lobby.id} (${lobby.playersCount}/10) — Хост: ${lobby.host}</span><button onclick="joinLobby('${lobby.id}')">🔗 Присоединиться</button>`;
                    lobbiesList.appendChild(div);
                });
            }
        }
        
        if(data.type === 'lobby_joined') {
            currentLobbyId = data.lobbyId; 
            isHost = data.isHost; 
            currentMapType = data.mapType; 
            gameStarted = false;
            isAlive = true;
            lobbiesScreen.classList.add('hidden'); 
            gameScreen.classList.remove('hidden');
            
            if (isHost) startGameBtn.classList.remove('hidden');
            else startGameBtn.classList.add('hidden');
            
            killBtn.classList.add('hidden');
            reportBtn.classList.add('hidden');
            roleDisplay.textContent = '📡 ЛОББИ';
            roleDisplay.style.color = '#ffaa00';
            colorIndicator.textContent = `🎨 Цвет: ${myColor === 'blue' ? 'Голубой' : 'Красный'}`;
            loadMap(currentMapType, true);
        }
        
        if(data.type === 'lobby_update') {
            players.clear();
            data.players.forEach(p => { 
                players.set(p.name, { x: p.x, y: p.y, isImpostor: false, alive: p.alive, dir: p.dir || 'right', bodyX: null, bodyY: null, color: p.color || 'blue' });
                if (p.name === myName && p.color) {
                    myColor = p.color;
                    colorIndicator.textContent = `🎨 Цвет: ${myColor === 'blue' ? 'Голубой' : 'Красный'}`;
                }
            });
            if (data.isHost !== undefined) {
                isHost = data.isHost;
                startGameBtn.classList.toggle('hidden', !isHost);
            }
        }
        
        if(data.type === 'chat_message') {
            addChatMessage(data.sender, data.message);
        }
        
        if(data.type === 'meeting_start') {
            startMeeting(data);
        }
        
        if(data.type === 'meeting_ended') {
            meetingActive = false;
            if (meetingTimer) clearInterval(meetingTimer);
            meetingWindow.style.display = 'none';
            alert(data.result);
        }
        
        if(data.type === 'player_ejected') {
            alert(`${data.name} был кикнут голосованием!`);
            if (data.name === myName) {
                isAlive = false;
                roleDisplay.textContent = '💀 ВЫ УБИТЫ 💀';
                roleDisplay.style.color = '#888';
            }
        }
        
        if(data.type === 'vote_update') {
            meetingStatus.textContent = `Проголосовало: ${data.votes}/${data.total}`;
        }
        
        if(data.type === 'return_to_lobby') {
            returnToLobby(data);
        }
        
        if(data.type === 'game_start') {
            gameStarted = true; 
            isImpostor = data.isImpostor;
            isAlive = true;
            
            player.speed = data.speed || 2.5;
            
            players.clear();
            data.players.forEach(p => { 
                players.set(p.name, { x: p.x, y: p.y, isImpostor: p.isImpostor, alive: p.alive, dir: p.dir || 'right', bodyX: null, bodyY: null, color: p.color || 'blue' });
                if (p.name === myName && p.color) {
                    myColor = p.color;
                    colorIndicator.textContent = `🎨 Цвет: ${myColor === 'blue' ? 'Голубой' : 'Красный'}`;
                }
            });
            player.x = 2280;
            player.y = 547;
            player.dir = 'right';
            roleDisplay.textContent = isImpostor ? '🔪 ТЫ ПРЕДАТЕЛЬ! 👿' : '😇 ТЫ МИРНЫЙ ЖИТЕЛЬ';
            roleDisplay.style.color = isImpostor ? '#ff6666' : '#66ff66';
            killBtn.classList.toggle('hidden', !isImpostor);
            reportBtn.classList.remove('hidden');
            startGameBtn.classList.add('hidden');
            chatBtn.style.display = 'none';
            loadMap(currentMapType, false);
        }
        
        if(data.type === 'players_update') {
            if(!gameStarted) return;
            data.players.forEach(p => { 
                if(players.has(p.name)) { 
                    const playerData = players.get(p.name);
                    playerData.x = p.x; 
                    playerData.y = p.y; 
                    playerData.alive = p.alive;
                    playerData.dir = p.dir || 'right';
                    playerData.color = p.color || playerData.color || 'blue';
                    if (!p.alive && !playerData.bodyX) {
                        playerData.bodyX = p.x;
                        playerData.bodyY = p.y;
                    }
                }
                if (p.name === myName) {
                    isAlive = p.alive;
                    if (!isAlive) {
                        roleDisplay.textContent = '💀 ВЫ УБИТЫ 💀';
                        roleDisplay.style.color = '#888';
                        killBtn.classList.add('hidden');
                        reportBtn.classList.add('hidden');
                    }
                }
            });
        }
        
        if(data.type === 'player_killed') {
            // Нет сообщения об убийстве
        }
        
        if(data.type === 'game_over') {
            gameStarted = false;
            alert(data.winner === 'crew' ? '😇 МИРНЫЕ ПОБЕДИЛИ!' : '🔪 ПРЕДАТЕЛИ ПОБЕДИЛИ!');
        }
        
        if(data.type === 'error') alert(data.message);
    }
    
    function loadMap(mapType, isLobby) {
        const mapWithColor = new Image();
        const cleanMap = new Image();
        
        if (isLobby) {
            mapWithColor.src = '/maps/lobby.png';
            cleanMap.src = '/maps/lobby2.png';
        } else {
            mapWithColor.src = '/maps/map.png';
            cleanMap.src = '/maps/map2.png';
        }
        
        mapWithColor.onload = () => {
            mapWidth = mapWithColor.width; 
            mapHeight = mapWithColor.height;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = mapWidth; 
            tempCanvas.height = mapHeight;
            tempCtx.drawImage(mapWithColor, 0, 0);
            try {
                const imageData = tempCtx.getImageData(0,0,mapWidth,mapHeight);
                walls = generateWallsFromColor(imageData, 18, 0, 38, 255, 20);
                console.log(`✅ ${walls.length} хитбоксов для ${isLobby ? 'лобби' : 'карты'}`);
            } catch(e) { console.error(e); walls = []; }
            
            cleanMap.onload = () => {
                mapToDraw = cleanMap;
                initGameCanvas();
            };
            if(cleanMap.complete) cleanMap.onload();
        };
    }
    
    function generateWallsFromColor(imageData, step, targetR, targetG, targetB, tolerance) {
        const width = imageData.width, height = imageData.height, data = imageData.data;
        const walkable = Array(height).fill().map(() => Array(width).fill(true));
        for(let y=0; y<height; y++) for(let x=0; x<width; x++) {
            const idx = (y*width + x)*4;
            const isWall = Math.abs(data[idx]-targetR)<=tolerance && Math.abs(data[idx+1]-targetG)<=tolerance && Math.abs(data[idx+2]-targetB)<=tolerance;
            if(isWall) walkable[y][x] = false;
        }
        const gridCols = Math.ceil(width/step), gridRows = Math.ceil(height/step);
        const blocked = Array(gridRows).fill().map(()=>Array(gridCols).fill(false));
        for(let gy=0; gy<gridRows; gy++) for(let gx=0; gx<gridCols; gx++) {
            let hasWall = false;
            const startX = gx*step, startY = gy*step, endX = Math.min(startX+step, width), endY = Math.min(startY+step, height);
            for(let y=startY; y<endY && !hasWall; y++) for(let x=startX; x<endX && !hasWall; x++) if(!walkable[y][x]) hasWall = true;
            blocked[gy][gx] = hasWall;
        }
        const used = Array(gridRows).fill().map(()=>Array(gridCols).fill(false));
        const rectangles = [];
        for(let gy=0; gy<gridRows; gy++) for(let gx=0; gx<gridCols; gx++) {
            if(blocked[gy][gx] && !used[gy][gx]) {
                let w = 1; while(gx+w < gridCols && blocked[gy][gx+w] && !used[gy][gx+w]) w++;
                let h = 1; let canExtend = true;
                while(gy+h < gridRows && canExtend) {
                    for(let cx=gx; cx<gx+w; cx++) if(!blocked[gy+h][cx] || used[gy+h][cx]) { canExtend=false; break; }
                    if(canExtend) h++;
                }
                for(let dy=0; dy<h; dy++) for(let dx=0; dx<w; dx++) used[gy+dy][gx+dx]=true;
                rectangles.push({x:gx*step, y:gy*step, w:w*step, h:h*step});
            }
        }
        return rectangles;
    }
    
    function checkCollision(x, y, w, h) {
        for(let wall of walls) if(x < wall.x+wall.w && x+w > wall.x && y < wall.y+wall.h && y+h > wall.y) return true;
        return false;
    }
    
    function initGameCanvas() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        
        if (!gameStarted) {
            player.x = 499;
            player.y = 353;
        } else {
            player.x = 2280;
            player.y = 547;
        }
        
        let lastSendX = player.x, lastSendY = player.y, lastSendDir = player.dir;
        setInterval(() => {
            if(ws && ws.readyState === WebSocket.OPEN && !meetingActive && isAlive) {
                if(Math.abs(player.x - lastSendX) > 3 || Math.abs(player.y - lastSendY) > 3 || player.dir !== lastSendDir) {
                    ws.send(JSON.stringify({type:'update_position', x:player.x, y:player.y, dir:player.dir}));
                    lastSendX = player.x; 
                    lastSendY = player.y;
                    lastSendDir = player.dir;
                }
            }
        }, 50);
        
        const keys = {};
        window.addEventListener('keydown', (e) => { 
            if (meetingActive) return;
            if (!isAlive) return;
            keys[e.code] = true; 
            e.preventDefault(); 
            if(keys['ArrowLeft']) player.dir = 'left'; 
            if(keys['ArrowRight']) player.dir = 'right'; 
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        
        function update() {
            if (meetingActive) { 
                draw(ctx);
                requestAnimationFrame(update);
                return; 
            }
            
            let nx = player.x, ny = player.y;
            let moved = false;
            if (isAlive) {
                if(keys['ArrowLeft']) { nx -= player.speed; moved = true; player.dir = 'left'; }
                if(keys['ArrowRight']) { nx += player.speed; moved = true; player.dir = 'right'; }
                if(keys['ArrowUp']) { ny -= player.speed; moved = true; }
                if(keys['ArrowDown']) { ny += player.speed; moved = true; }
            }
            
            if (moved) playStepSound(nx, ny);
            
            nx = Math.max(0, Math.min(nx, mapWidth - player.w));
            ny = Math.max(0, Math.min(ny, mapHeight - player.h));
            if(!checkCollision(nx, player.y, player.w, player.h)) player.x = nx;
            if(!checkCollision(player.x, ny, player.w, player.h)) player.y = ny;
            draw(ctx);
            requestAnimationFrame(update);
        }
        
        function draw(ctx) {
            const ZOOM = 2.0;
            
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save();
            
            const camX = canvas.width/2 - (player.x + player.w/2) * ZOOM;
            const camY = canvas.height/2 - (player.y + player.h/2) * ZOOM;
            ctx.translate(camX, camY);
            ctx.scale(ZOOM, ZOOM);
            
            if(mapToDraw) ctx.drawImage(mapToDraw, 0, 0);
            
            // ОТЛАДКА: показываем хитбоксы если включено
            if (showHitboxes) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                for (let wall of walls) {
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                }
            }
            
            // Трупы (с учётом цвета убитого)
            for(let [name, p] of players.entries()) {
                if (!p.alive && p.bodyX && p.bodyY) {
                    const deadSprite = getDeadSprite(p.color || 'blue');
                    if (deadSprite.complete && deadSprite.naturalWidth > 0) {
                        ctx.drawImage(deadSprite, p.bodyX, p.bodyY, player.w, player.h);
                    } else {
                        ctx.fillStyle = '#880000';
                        ctx.fillRect(p.bodyX, p.bodyY, player.w, player.h);
                        ctx.fillStyle = 'white';
                        ctx.font = '20px Arial';
                        ctx.fillText('💀', p.bodyX + 8, p.bodyY + 25);
                    }
                }
            }
            
            // Живые игроки
            for(let [name, p] of players.entries()) {
                if(name !== myName && p.alive) {
                    const sprite = getPlayerSprite(p.color || 'blue', p.dir);
                    if (sprite.complete && sprite.naturalWidth > 0) {
                        ctx.drawImage(sprite, p.x, p.y, player.w, player.h);
                    } else {
                        ctx.fillStyle = p.isImpostor ? '#aa0000' : '#44aa44';
                        ctx.fillRect(p.x, p.y, player.w, player.h);
                    }
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.fillText(name, p.x, p.y-5);
                }
            }
            
            // Свой игрок
            if (isAlive) {
                const mySprite = getPlayerSprite(myColor, player.dir);
                if (mySprite.complete && mySprite.naturalWidth > 0) {
                    ctx.drawImage(mySprite, player.x, player.y, player.w, player.h);
                } else {
                    ctx.fillStyle = isImpostor ? '#ff4444' : '#ff8888';
                    ctx.fillRect(player.x, player.y, player.w, player.h);
                }
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText(myName, player.x, player.y-5);
            }
            
            ctx.restore();
        }
        
        update();
    }
</script>
